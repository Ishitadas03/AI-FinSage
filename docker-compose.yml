version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: finsage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finsage_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finsage_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finsage-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      APP_NAME: "FinSage API"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/finsage_db
      JWT_SECRET_KEY: finsage_super_secret_jwt_key_change_in_production_9f83b27e
      CORS_ORIGINS: "http://localhost:8080,http://localhost:5173,http://localhost:3000,https://ai-finsage.vercel.app"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finsage-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
    driver: local
